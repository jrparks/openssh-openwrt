name: Build OpenSSH for GL.iNet aarch64

# Builds openssh-server, openssh-keygen and openssh-sftp-server .ipk for
# GL.iNet firmware based on OpenWrt 23.05 (aarch64_cortex-a53_neon-vfpv4).
# A v* tag publishes a release with the packages and SHA256SUMS.txt.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The host only runs the SDK's prebuilt cross toolchain; output does not
      # depend on it. python3-setuptools supplies the distutils module the
      # 23.05 SDK's prereq check imports (removed from Python 3.12).
      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext git libncurses-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget curl xz-utils

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: openssh-ipk
          path: output/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: openssh-ipk
          path: output

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "OpenSSH ${GITHUB_REF_NAME#v} for GL.iNet aarch64 (OpenWrt 23.05 base)" \
            --notes-file - ./*.ipk SHA256SUMS.txt <<EOF
          Packages for GL.iNet routers on OpenWrt 23.05-based firmware
          (arch \`aarch64_cortex-a53_neon-vfpv4\`), built with the stock OpenWrt
          23.05.5 armsr/armv8 SDK from OpenWrt's current openssh package.

          Verify: \`sha256sum -c SHA256SUMS.txt\`
          Install: see README.
          EOF
